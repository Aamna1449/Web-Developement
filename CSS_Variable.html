<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variable</title>
    <style>
        :root {
    --main-color: blue;
}

h1 {
    color: var(--main-color);
}

button {
    background-color: var(--main-color);
}

</head>
<body>
    <h1>Hey I am aamna</h1>
    <button>Click me</button>
    
</body>
</html>
